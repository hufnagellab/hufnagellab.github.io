<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IBRO Awardees Map (USA/Canada)</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>IBRO Awardees — USA & Canada</h1>
    <div class="controls">
      <input id="search" placeholder="Search name, institution, city..." />
      <select id="programFilter">
        <option value="">All programs</option>
      </select>
      <select id="yearFilter">
        <option value="">All years</option>
      </select>
    </div>
  </header>

  <main>
    <div id="map"></div>

    <aside id="panel">
      <h2 id="panelTitle">Click a marker</h2>
      <div id="panelMeta" class="muted"></div>
      <ul id="awardeeList"></ul>
    </aside>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="app.js"></script>
</body>
</html>
