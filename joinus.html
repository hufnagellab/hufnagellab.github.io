  <style>

    /* =====================================================
       HUFNAGEL LAB — JOIN US PAGE
       ===================================================== */

    .joinus-page {
      background: #f5f1e7;
      color: #142237;
    }


    /* =====================================================
       HERO
       ===================================================== */

    .joinus-page .page-intro {
      background:
        radial-gradient(
          ellipse at 85% 10%,
          rgba(205,175,115,0.08),
          transparent 45%
        ),
        linear-gradient(
          125deg,
          #101e30 0%,
          #17283b 55%,
          #0b1929 100%
        );

      padding: 100px 0 110px;
    }

    .joinus-page .page-intro .container {
      max-width: 1120px;
    }

    .joinus-page .eyebrow {
      color: #c9a463;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    .joinus-page .page-intro h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(52px, 6vw, 88px);
      line-height: 1.08;
      font-weight: 700;
      letter-spacing: -0.035em;
      color: #f4efe5;
      margin: 0 0 30px;
    }

    .joinus-page .gold-period {
      color: #c9a463;
    }

    .joinus-page .intro-lead {
      max-width: 790px;
      color: #c5cbd1;
      font-size: 18px;
      line-height: 1.85;
      margin: 0;
    }

    .joinus-page .gold-line {
      width: 72px;
      height: 3px;
      background: #c9a463;
      margin-top: 40px;
    }


    /* =====================================================
       SHARED SECTION STYLES
       ===================================================== */

    .joinus-page .join-section {
      padding: 95px 0 105px;
    }

    .joinus-page .section-number {
      display: block;
      color: #a6844c;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    .joinus-page .section-heading {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(32px, 3.2vw, 48px);
      font-weight: 700;
      line-height: 1.17;
      letter-spacing: -0.025em;
      color: #142237;
      margin: 0 0 25px;
    }

    .joinus-page .section-heading span {
      color: #967440;
    }

    .joinus-page .section-description {
      max-width: 800px;
      font-size: 17px;
      line-height: 1.85;
      color: #526073;
      margin: 0 0 45px;
    }


    /* =====================================================
       OPEN POSITIONS
       ===================================================== */

    .joinus-page .openings-section {
      background: #f5f1e7;
    }

    .joinus-page .position-card {
      position: relative;

      background: #fffdf8;

      border: 1px solid rgba(20,34,55,0.10);
      border-radius: 8px;

      padding: 45px 50px;

      box-shadow:
        0 12px 35px rgba(20,34,55,0.035);
    }

    .joinus-page .position-card::before {
      content: "";

      position: absolute;

      left: 0;
      top: 0;
      bottom: 0;

      width: 4px;

      background: #243b50;

      border-radius: 8px 0 0 8px;
    }

    .joinus-page .position-topline {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 22px;
    }

    .joinus-page .position-type {
      color: #a6844c;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .joinus-page .position-location {
      color: #657184;
      font-size: 13px;
    }

    .joinus-page .position-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(26px, 2.7vw, 36px);
      line-height: 1.2;
      color: #142237;
      margin: 0 0 22px;
    }

    .joinus-page .position-intro {
      max-width: 900px;
      color: #364356;
      font-size: 16px;
      line-height: 1.9;
      margin: 0 0 35px;
    }

    .joinus-page .position-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 55px;
      margin-bottom: 35px;
    }

    .joinus-page .position-details h4 {
      color: #142237;
      font-size: 15px;
      font-weight: 700;
      margin: 0 0 20px;
    }

    .joinus-page .position-details ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .joinus-page .position-details li {
      position: relative;
      padding-left: 20px;
      margin-bottom: 13px;

      color: #526073;
      font-size: 14px;
      line-height: 1.75;
    }

    .joinus-page .position-details li::before {
      content: "•";
      position: absolute;
      left: 0;
      color: #a6844c;
      font-weight: 700;
    }

    .joinus-page .position-footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 25px;

      border-top: 1px solid rgba(20,34,55,0.10);
      padding-top: 30px;
    }

    .joinus-page .position-meta {
      color: #657184;
      font-size: 13px;
      line-height: 1.8;
    }

    .joinus-page .position-meta strong {
      color: #142237;
    }


    /* =====================================================
       BUTTONS
       ===================================================== */

    .joinus-page .button-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;

      padding: 14px 26px;

      background: #142237;
      color: #f4efe5;

      border: 1px solid #142237;
      border-radius: 4px;

      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;

      text-decoration: none;

      transition:
        background 0.25s ease,
        transform 0.25s ease;
    }

    .joinus-page .button-primary:hover {
      background: #243b50;
      transform: translateY(-2px);
    }


    /* =====================================================
       LAB CULTURE
       ===================================================== */

    .joinus-page .culture-section {
      background: #ece8df;

      border-top: 1px solid rgba(20,34,55,0.08);
    }

    .joinus-page .culture-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 75px;
      align-items: start;
    }

    .joinus-page .culture-text p {
      color: #364356;
      font-size: 16px;
      line-height: 1.95;
      margin: 0 0 22px;
    }

    .joinus-page .culture-values {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
    }

    .joinus-page .value-card {
      border-top: 2px solid #c9a463;
      padding-top: 18px;
    }

    .joinus-page .value-number {
      display: block;

      color: #a6844c;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;

      margin-bottom: 12px;
    }

    .joinus-page .value-card h3 {
      font-family: Georgia, "Times New Roman", serif;
      color: #142237;
      font-size: 22px;
      margin: 0 0 12px;
    }

    .joinus-page .value-card p {
      color: #526073;
      font-size: 14px;
      line-height: 1.75;
      margin: 0;
    }


    /* =====================================================
       ADDITIONAL OPPORTUNITIES
       ===================================================== */

    .joinus-page .opportunities-section {
      background: #f5f1e7;
    }

    .joinus-page .opportunities-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
    }

    .joinus-page .opportunity-card {
      background: #fffdf8;

      border: 1px solid rgba(20,34,55,0.10);
      border-radius: 6px;

      padding: 30px;

      transition: transform 0.25s ease;
    }

    .joinus-page .opportunity-card:hover {
      transform: translateY(-4px);
    }

    .joinus-page .opportunity-number {
      color: #a6844c;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.15em;
    }

    .joinus-page .opportunity-card h3 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 23px;
      color: #142237;
      margin: 20px 0 15px;
    }

    .joinus-page .opportunity-card p {
      color: #526073;
      font-size: 14px;
      line-height: 1.85;
      margin: 0;
    }


    /* =====================================================
       CONTACT SECTION
       ===================================================== */

    .joinus-page .contact-section {
      background: #142237;
      padding: 90px 0;
      text-align: center;
    }

    .joinus-page .contact-section .sect
